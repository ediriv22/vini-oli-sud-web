name: Manutenzione server (temporaneo)

# Workflow temporaneo, solo manuale: cancella file residui sul server Aruba
# usando i secret FTP gia' presenti. Da rimuovere dopo l'uso.
on:
  workflow_dispatch:
    inputs:
      delete_paths:
        description: "File da cancellare, relativi a www.vinisud.it/, separati da spazio"
        required: false
        default: ""
      remove_request_id:
        description: "cognome della prenotazione di prova da togliere da forms/data/pass-giurato-iscrizioni.csv"
        required: false
        default: ""

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Elenco forms/ (solo nomi) prima
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "--- radice FTP"; curl -sSk --ssl-reqd --ftp-ssl -u "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$FTP_SERVER/" -l | sort | head -40
          echo "--- www.vinisud.it/"; curl -sSk --ssl-reqd --ftp-ssl -u "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$FTP_SERVER/www.vinisud.it/" -l | sort | head -40
          echo "--- forms/"; curl -sSk --ssl-reqd --ftp-ssl -u "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$FTP_SERVER/www.vinisud.it/forms/" -l | sort
          echo "--- forms/data (solo nomi)"
          curl -sSk --ssl-reqd --ftp-ssl -u "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$FTP_SERVER/www.vinisud.it/forms/data/" -l | sort || true
      - name: Cancella i file richiesti
        if: ${{ github.event.inputs.delete_paths != '' }}
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          PATHS: ${{ github.event.inputs.delete_paths }}
        run: |
          for p in $PATHS; do
            case "$p" in *..*|/*) echo "percorso non valido: $p"; exit 1;; esac
            echo "DELE $p"
            curl -sSk --ssl-reqd --ftp-ssl -u "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$FTP_SERVER/" -Q "-DELE www.vinisud.it/$p" -o /dev/null && echo "  cancellato" || echo "  non cancellato (assente?)"
          done
          echo "--- forms/ dopo"
          curl -sSk --ssl-reqd --ftp-ssl -u "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$FTP_SERVER/www.vinisud.it/forms/" -l | sort
      - name: Toglie una prenotazione di prova dal CSV (con backup sul server)
        if: ${{ github.event.inputs.remove_request_id != '' }}
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          RID: ${{ github.event.inputs.remove_request_id }}
        run: |
          set -e
          U="ftp://$FTP_SERVER/www.vinisud.it/forms/data/pass-giurato-iscrizioni.csv"
          curl -sSk --ssl-reqd --ftp-ssl -u "$FTP_USERNAME:$FTP_PASSWORD" "$U" -o cur.csv
          BK="ftp://$FTP_SERVER/www.vinisud.it/forms/data/pass-giurato-iscrizioni.csv.bak_$(date +%Y%m%d_%H%M)_test_cleanup"
          curl -sSk --ssl-reqd --ftp-ssl -u "$FTP_USERNAME:$FTP_PASSWORD" -T cur.csv "$BK"
          python3 - <<'PY'
          import csv, os
          rid = os.environ["RID"]
          rows = list(csv.reader(open("cur.csv", newline="", encoding="utf-8")))
          hdr = rows[0]; idx = hdr.index("cognome")
          keep = [rows[0]] + [r for r in rows[1:] if r and r[idx] != rid]
          print("righe prima:", len(rows) - 1, "dopo:", len(keep) - 1)
          assert len(rows) - len(keep) == 1, "attesa esattamente 1 riga da togliere"
          csv.writer(open("new.csv", "w", newline="", encoding="utf-8")).writerows(keep)
          PY
          curl -sSk --ssl-reqd --ftp-ssl -u "$FTP_USERNAME:$FTP_PASSWORD" -T new.csv "$U"
          echo "CSV aggiornato"
