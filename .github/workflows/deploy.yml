name: Deploy sito su Aruba

# Si attiva a ogni modifica su main (incluse quelle del CMS della segretaria)
# e, manualmente, dal tab Actions di GitHub.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Una pubblicazione alla volta: se ne parte una nuova, annulla la precedente.
concurrency:
  group: deploy-aruba
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installazione dipendenze
        run: npm ci

      - name: Build sito statico (cartella out/)
        run: npm run build

      - name: Verifica sintassi PHP (blocca il deploy se rotto)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y php-cli -qq
          find public -name '*.php' -print0 | xargs -0 -r -n1 php -l

      - name: Pubblicazione su Aruba via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./out/
          # L'utente FTP atterra un livello sopra: il sito vive in www.vinisud.it/
          server-dir: ./www.vinisud.it/
          # NON toccare le cartelle gestite a mano sul server:
          # - forms/  → backend PHP, config.php, PHPMailer, log (mai sovrascrivere)
          # - cgi-bin/ → cartella di sistema Aruba
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            forms/**
            cgi-bin/**
            admin/config.php
            **/*_Backup_*/**
