name: FTP debug (temporaneo)

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Installa lftp
        run: sudo apt-get update -qq && sudo apt-get install -y lftp -qq

      - name: Elenca cosa vede l'utente FTP
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASS" "ftp.vinisud.it" <<'EOF'
          set ssl:verify-certificate no
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          echo "=== PWD (cartella di atterraggio) ==="
          pwd
          echo "=== LS radice FTP ==="
          ls
          echo "=== prova: esiste _next nella radice? ==="
          cls -1 _next || echo "NO _next qui"
          echo "=== prova sottocartelle tipiche ==="
          cls -1 || true
          bye
          EOF
