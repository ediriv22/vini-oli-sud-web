backend:
  name: test
  # Backend test per demo: non richiede autenticazione GitHub
  # Per production: usare 'github' + configurare OAuth su Vercel Environment

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: "pages"
    label: "Pagine"
    folder: "content/pages"
    format: "frontmatter"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Titolo", name: "title", widget: "string"}
      - {label: "Descrizione", name: "description", widget: "text"}
      - {label: "Slug", name: "slug", widget: "string"}
      - {label: "Contenuto", name: "body", widget: "markdown"}
      - {label: "Template", name: "template", widget: "select", options: ["default", "landing", "service"]}

  - name: "sections"
    label: "Sezioni Homepage"
    folder: "content/sections"
    format: "json"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Nome Sezione", name: "name", widget: "string"}
      - {label: "Titolo", name: "title", widget: "string"}
      - {label: "Sottotitolo", name: "subtitle", widget: "text"}
      - {label: "Descrizione", name: "description", widget: "markdown"}
      - {label: "Tipo", name: "type", widget: "select", options: ["hero", "highlight", "gallery", "testimonial", "cta"]}
      - {label: "Visibile", name: "visible", widget: "boolean", default: true}
      - {label: "Ordine", name: "order", widget: "number"}

  - name: "navigation"
    label: "Navigazione"
    files:
      - name: "main"
        label: "Menu Principale"
        file: "content/navigation/main.json"
        format: "json"
        fields:
          - label: "Voci Menu"
            name: "items"
            widget: "list"
            fields:
              - {label: "Etichetta", name: "label", widget: "string"}
              - {label: "Link", name: "href", widget: "string"}
              - {label: "Icona", name: "icon", widget: "string", required: false}

  - name: "settings"
    label: "Impostazioni Sito"
    files:
      - name: "site"
        label: "Configurazione Sito"
        file: "content/settings/site.json"
        format: "json"
        fields:
          - {label: "Nome Sito", name: "siteName", widget: "string"}
          - {label: "Descrizione", name: "siteDescription", widget: "text"}
          - {label: "Email Contatti", name: "contactEmail", widget: "string"}
          - {label: "Telefono", name: "phone", widget: "string"}
          - {label: "Indirizzo", name: "address", widget: "text"}

locale: "it"
